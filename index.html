<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213D">
<title>Squad KL 13</title>
<!--
  SETUP (only needed to share data between squad members' phones):
  1. Go to console.firebase.google.com, create a free project.
  2. Build > Realtime Database > Create database > start in TEST MODE.
  3. Copy the database URL (looks like https://your-project-default-rtdb.firebaseio.com)
  4. Paste it between the quotes on the FIREBASE_URL line below.
  5. Put this one file online (Netlify Drop, GitHub Pages, Firebase Hosting) and send the link to your squad.
  Leave FIREBASE_URL empty to use the app on one phone only.
-->
<style>
:root{--ink:#14213D;--paper:#F2F5F8;--surface:#fff;--teal:#0E7C7B;--sun:#E8963A;--red:#B3261E;--line:#D5DDE5;--muted:#5B6B80;--warnbg:#FFF4E5;--infobg:#E6F3F2;--errbg:#FDECEA;--onink:#fff;
--serif:'Iowan Old Style','Palatino Linotype',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#E8EDF4;--paper:#0F1623;--surface:#18223A;--teal:#35B5B3;--sun:#F0A851;--red:#F2766E;--line:#2C3957;--muted:#9AA8BD;--warnbg:#3A2C17;--infobg:#143533;--errbg:#3D1D1A;--onink:#0F1623;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0;letter-spacing:-.5px}
h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:26px 0 12px}
button,input,select{font-family:var(--sans);color:var(--ink)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--surface)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12.5px}
.serif{font-family:var(--serif)}
.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}
.btn{width:100%;padding:12px 0;border:none;border-radius:8px;font-size:16px;background:var(--ink);color:var(--onink)}
.btn.off{background:var(--line);cursor:default}
.btn.teal{background:var(--teal);color:#fff}.btn.grey{background:var(--muted);color:#fff}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--red)}
.add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 0;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:16px;margin-bottom:18px}
.ghost{background:none;border:none;color:var(--muted);padding:4px;font-size:16px}
.tabs{display:flex;gap:4px;margin:16px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:9px 12px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--onink)}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:15px}
.seg button.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.banner{border-radius:12px;padding:12px;margin-bottom:14px;font-size:14.5px;width:100%;text-align:left;display:block}
.track{position:relative;height:10px;margin:10px 0 8px}
.track .bg{position:absolute;inset:0;background:var(--paper);border-radius:5px;border:1px solid var(--line)}
.track .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px;transition:width .4s ease}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.circle{flex-shrink:0;width:34px;height:34px;border-radius:17px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.circle.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pos{color:var(--teal)}.neg{color:var(--red)}.warn{color:var(--sun)}
.del{text-align:right;margin-top:6px}
.del .yes{color:var(--red);font-weight:600;background:none;border:none;font-size:13px}
.del .no{color:var(--muted);background:none;border:none;font-size:13px}
.stat .v{font-family:var(--serif);font-size:22px}.stat .l{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:7px 12px;border-radius:16px;font-size:14px;border:1.5px solid var(--line);background:transparent}
.chip.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.rsvp{display:flex;gap:6px;margin-top:12px}
.rsvp button{flex:1;padding:9px 0;border-radius:8px;font-size:14px;border:1.5px solid var(--line);background:transparent}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1.4;word-wrap:break-word}
.msg.mine{margin-left:auto;background:var(--teal);border-color:var(--teal);color:#fff}
.msg .who{font-size:12px;opacity:.75;margin-bottom:2px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--sun);color:#14213D;margin-left:6px;font-weight:600;vertical-align:middle}
.sbtn{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px}
.sbtn.red{color:var(--red);border-color:var(--red)}
@media (prefers-reduced-motion:reduce){.track .fill{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
/* ====== PASTE YOUR FIREBASE DATABASE URL BETWEEN THE QUOTES (optional) ====== */
var FIREBASE_URL = "https://kl-13-esports-og-default-rtdb.firebaseio.com";
/* ========================================================================== */
var SQUAD_NAME='KL 13', SQ='KL_13';
var LS={profile:'sq-app-profile',goals:'sq-app-goals',money:'sq-app-money',squad:'sq-app-squad-local',seen:'sq-app-seen'};
var SEEN={chat:0,ann:''};
var CATS_IN=['Salary','Streaming','Sponsorship','Coaching','Other'];
var CATS_OUT=['Gear','Travel','Food','Subscriptions','Bills','Other'];
var CATS_SQ=['Entry fee','Gear','Travel','Food','Subscription','Other'];
var DAY=86400000;
var DB=FIREBASE_URL.replace(/\/+$/,'');

function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/DAY)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function san(s){return String(s).trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'_').slice(0,40)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function niceDate(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function countdown(d){var n=daysBetween(today(),d);if(n===0)return'Today';if(n===1)return'Tomorrow';if(n>1)return'In '+n+' days';return Math.abs(n)+' day'+(n===-1?'':'s')+' ago'}
function vals(o){return Object.keys(o||{}).map(function(k){return o[k]})}

var S={tab:'schedule',profile:null,goals:[],entries:[],squad:{members:{},t:{},e:{},r:{},c:{},a:{},meta:{},kicked:{}},sync:DB?'connecting':'local',error:'',kickedMsg:'',
ui:{goalForm:false,moneyForm:false,tForm:false,sForm:false,tView:'upcoming',month:today().slice(0,7),recording:null,confirm:null,log:{},leave:false,act:null,pin:'',pinMsg:'',focusChat:false,scrollChat:false},
drafts:{join:{name:''},goal:{title:'',target:'',unit:'',deadline:''},
money:{type:'spending',amount:'',category:CATS_OUT[0],note:'',date:today()},
sched:{name:'',game:'',date:today(),time:'',fee:'',paidBy:'',notes:''},
result:{placement:'',prize:'',receivedBy:'',notes:'',played:[],mvp:''},chat:{text:''},ann:{text:''},
split:{type:'expense',desc:'',amount:'',who:'',category:CATS_SQ[0],date:today(),split:[]}}};

/* ---------- storage ---------- */
function lsGet(k,def){try{var r=localStorage.getItem(k);return r?JSON.parse(r):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){S.error='This browser is blocking saved data, so changes may be lost.';return false}}
function savePersonal(){lsSet(LS.goals,S.goals);lsSet(LS.money,S.entries)}
function normSquad(d){d=d||{};return{members:d.members||{},t:d.t||{},e:d.e||{},r:d.r||{},c:d.c||{},a:d.a||{},meta:d.meta||{},kicked:d.kicked||{}}}
function url(path){return DB+'/squads/'+SQ+path+'.json'}
function afterPull(){if(S.profile&&S.squad.kicked[san(S.profile.name)]){try{localStorage.removeItem(LS.profile)}catch(e){}S.profile=null;S.kickedMsg='The squad leader removed you from this squad.'}}
function pull(){
if(!DB){S.squad=normSquad(lsGet(LS.squad,{}));S.sync='local';afterPull();return Promise.resolve()}
return fetch(url('')).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()}).then(function(d){S.squad=normSquad(d);S.sync='online';afterPull()}).catch(function(){S.sync='offline'})}
function pullChat(){
if(!DB)return Promise.resolve();
return fetch(url('/c')).then(function(r){if(!r.ok)throw new Error('http');return r.json()}).then(function(d){S.squad.c=d||{};S.sync='online'}).catch(function(){S.sync='offline'})}
function put(kind,id,obj){
S.squad[kind][id]=obj;
if(!DB){lsSet(LS.squad,S.squad);return Promise.resolve()}
return fetch(url('/'+kind+'/'+id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(function(r){if(!r.ok)throw 0;S.sync='online'}).catch(function(){S.sync='offline';S.error="Couldn't reach the squad database. That change may not be shared.";render()})}
function del(kind,id){
delete S.squad[kind][id];
if(!DB){lsSet(LS.squad,S.squad);return Promise.resolve()}
return fetch(url('/'+kind+'/'+id),{method:'DELETE'}).then(function(r){if(!r.ok)throw 0}).catch(function(){S.sync='offline';S.error="Couldn't reach the squad database. That delete may not be shared.";render()})}

/* ---------- derived ---------- */
function sym(){return(S.profile&&S.profile.currency)||'$'}
function money(n,signed){var body=sym()+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});if(!signed)return n<0?'-'+body:body;return(Math.abs(n)<0.005?'':n<0?'-':'+')+body}
function me(){return S.profile?S.profile.name:''}
function names(){var n=vals(S.squad.members).map(function(m){return m.name}).sort(function(a,b){return a.localeCompare(b)});if(me()&&n.indexOf(me())<0)n.push(me());return n}
function balances(){var b={};names().forEach(function(n){b[n]=0});function add(n,v){b[n]=(b[n]||0)+v}
vals(S.squad.e).forEach(function(e){if(e.type==='expense'){add(e.who,e.amount);e.split.forEach(function(n){add(n,-e.amount/e.split.length)})}else if(e.type==='prize'){add(e.who,-e.amount);e.split.forEach(function(n){add(n,e.amount/e.split.length)})}else if(e.type==='payment'){add(e.who,e.amount);add(e.to,-e.amount)}});return b}
function transfers(bal){var D=[],C=[];Object.keys(bal).forEach(function(n){var v=bal[n];if(v<-0.005)D.push({n:n,v:-v});else if(v>0.005)C.push({n:n,v:v})});D.sort(function(a,b){return b.v-a.v});C.sort(function(a,b){return b.v-a.v});var out=[],i=0,j=0;
while(i<D.length&&j<C.length){var a=Math.min(D[i].v,C[j].v);if(a>0.005)out.push({from:D[i].n,to:C[j].n,amount:Math.round(a*100)/100});D[i].v-=a;C[j].v-=a;if(D[i].v<0.005)i++;if(C[j].v<0.005)j++}return out}

/* ---------- view helpers ---------- */
function inp(path,val,attrs){return '<input data-f="'+path+'" value="'+esc(val)+'" '+(attrs||'')+'>'}
function sel(path,opts,cur,first){return '<select data-f="'+path+'">'+(first?'<option value="">'+esc(first)+'</option>':'')+opts.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function formHead(title,act){return '<div class="between mb10" style="align-items:center"><strong class="serif" style="font-size:18px">'+title+'</strong><button class="ghost" data-act="'+act+'" aria-label="Cancel">✕</button></div>'}
function delRow(kind,id,label){var key=kind+id;if(S.ui.confirm===key)return '<div class="del small muted">'+label+' <button class="yes" data-act="delYes" data-kind="'+kind+'" data-id="'+id+'">Delete</button> <button class="no" data-act="delNo">Keep</button></div>';return '<div class="del"><button class="ghost" aria-label="Delete" data-act="delAsk" data-kind="'+kind+'" data-id="'+id+'">🗑</button></div>'}

/* ---------- JOIN ---------- */
function joinView(){var n=S.drafts.join.name,ok=n.trim().length>=2;
return '<div style="padding-top:20px"><h1>Squad '+SQUAD_NAME+'</h1><p class="muted" style="font-size:15px;margin:6px 0 24px;line-height:1.45">Your goals and money, plus shared tournament reminders and expenses for your squad.</p>'
+'<div class="card"><label class="small muted">Your player name</label><div style="margin:4px 0 14px">'+inp('drafts.join.name',n,'placeholder="e.g. Ravi" autocomplete="off"')+'</div>'
+'<button class="btn '+(ok?'':'off')+'" data-act="join">Join squad '+SQUAD_NAME+'</button>'
+'<p class="tiny muted" style="margin:12px 0 0;line-height:1.4">Use the same name every time to get back into your account. '+(DB?'Anyone who opens this app can join the squad and see its schedule and expenses.':'This copy of the app is not connected to a database yet, so squad data stays on this phone.')+'</p></div></div>'}

/* ---------- GOALS ---------- */
function pace(g){if(g.done||!g.deadline)return null;var total=Math.max(1,daysBetween(g.createdAt,g.deadline));var el=Math.min(total,Math.max(0,daysBetween(g.createdAt,today())));var left=daysBetween(today(),g.deadline);var exp=el/total*g.target;var diff=g.current-exp;var st='on pace';if(left<0&&g.current<g.target)st='overdue';else if(diff>g.target*.05)st='ahead';else if(diff<-g.target*.05)st='behind';return{left:left,status:st,exp:Math.min(100,exp/g.target*100)}}
function goalCard(g){
var pct=Math.min(100,g.current/g.target*100),p=pace(g),late=p&&(p.status==='behind'||p.status==='overdue');
var h='<div class="card" style="'+(g.done?'opacity:.75':'')+'"><div class="between" style="align-items:flex-start"><div class="serif" style="font-size:19px;line-height:1.25">'+esc(g.title)+'</div><button class="circle '+(g.done?'on':'')+'" data-act="goalDone" data-id="'+g.id+'" aria-label="'+(g.done?'Reopen goal':'Mark goal done')+'">'+(g.done?'↺':'✓')+'</button></div>'
+'<div style="display:flex;align-items:baseline;gap:6px;margin-top:10px"><span class="serif" style="font-size:30px">'+fmt(g.current)+'</span><span class="muted" style="font-size:14px">of '+fmt(g.target)+' '+esc(g.unit)+'</span></div>'
+'<div class="track"><div class="bg"></div><div class="fill" style="width:'+pct+'%;background:var(--'+(late?'sun':'teal')+')"></div>'+(p?'<div class="mark" style="left:calc('+p.exp+'% - 1px)"></div>':'')+'</div>'
+'<div class="between small muted"><span>'+Math.round(pct)+'% complete</span>'+(p?'<span class="'+(late?'warn':'pos')+'" style="font-weight:600">'+(p.status==='overdue'?'Overdue by '+Math.abs(p.left)+'d':p.status+', '+p.left+'d left')+'</span>':'')+(g.done?'<span class="pos" style="font-weight:600">Done</span>':'')+'</div>';
if(!g.done)h+='<div class="row" style="margin-top:14px"><input type="number" inputmode="decimal" placeholder="Add progress'+(g.unit?' ('+esc(g.unit)+')':'')+'" data-f="ui.log.'+g.id+'" value="'+esc(S.ui.log[g.id]||'')+'"><button class="btn" style="flex:0 0 72px;padding:0" data-act="goalLog" data-id="'+g.id+'">Log</button></div>';
if(g.log.length)h+='<div class="tiny muted" style="margin-top:12px">Last update: '+(g.log[0].amt>0?'+':'')+fmt(g.log[0].amt)+' '+esc(g.unit)+' on '+g.log[0].date+'</div>';
return h+delRow('goal',g.id,'Delete this goal?')+'</div>'}
function goalsView(){
var act=S.goals.filter(function(g){return!g.done}),fin=S.goals.filter(function(g){return g.done}),d=S.drafts.goal;
var h='<p class="muted" style="margin:0 0 16px;font-size:15px">Your private goals. Only you can see these.'+(S.goals.length?' '+act.length+' in progress, '+fin.length+' done.':'')+'</p>';
if(!S.ui.goalForm)h+='<button class="add" data-act="goalForm">＋ Add a goal</button>';
else h+='<div class="card" style="margin-bottom:18px">'+formHead('New goal','goalForm')
+'<div class="mb10">'+inp('drafts.goal.title',d.title,'placeholder="What do you want to achieve?"')+'</div>'
+'<div class="row mb10">'+inp('drafts.goal.target',d.target,'type="number" inputmode="decimal" placeholder="Target (e.g. 12)"')+inp('drafts.goal.unit',d.unit,'placeholder="Unit (wins)"')+'</div>'
+'<label class="small muted" style="display:block;margin-bottom:4px">Deadline (optional)</label><div class="mb14">'+inp('drafts.goal.deadline',d.deadline,'type="date" min="'+today()+'"')+'</div>'
+'<p class="tiny muted" style="margin:0 0 12px">Leave the target empty to track progress as a percentage out of 100.</p>'
+'<button class="btn '+(d.title.trim()?'':'off')+'" data-act="goalSave">Save goal</button></div>';
h+=act.map(goalCard).join('');if(fin.length)h+='<h2>Completed</h2>'+fin.map(goalCard).join('');return h}

/* ---------- MY MONEY ---------- */
function myMoneyView(){
var m=S.ui.month,d=S.drafts.money;
var label=new Date(m+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
var inM=S.entries.filter(function(e){return e.date.indexOf(m)===0}).sort(function(a,b){return b.date.localeCompare(a.date)});
var inc=0,out=0;inM.forEach(function(e){if(e.type==='income')inc+=e.amount;else out+=e.amount});var net=inc-out;
function row(l,v,c){return '<div class="between" style="padding:6px 0;font-size:15px"><span class="muted">'+l+'</span><span class="'+(c||'')+'" style="font-weight:600">'+v+'</span></div>'}
var h='<div class="between mb14" style="align-items:center"><button class="ghost" data-act="monthPrev" aria-label="Previous month" style="font-size:22px">‹</button><div class="serif" style="font-size:20px">'+label+'</div><button class="ghost" data-act="monthNext" aria-label="Next month" style="font-size:22px">›</button></div>'
+'<div class="card"><div class="small muted">'+(net>=0?'Profit this month':'Loss this month')+' (just you)</div><div class="serif '+(net>=0?'pos':'neg')+'" style="font-size:38px;margin:2px 0 8px">'+money(net,true)+'</div>'
+'<div style="border-top:1px solid var(--line);padding-top:6px">'+row('Income',money(inc),'pos')+row('Spending',money(-out),out>0?'neg':'')+'</div>'
+'<p class="tiny muted" style="margin:8px 0 0">Private to you. Shared squad costs go in the Split tab.</p></div>';
if(!S.ui.moneyForm)h+='<button class="add" data-act="moneyForm">＋ Add income or spending</button>';
else{var cats=d.type==='income'?CATS_IN:CATS_OUT;
h+='<div class="card" style="margin-bottom:18px">'+formHead('New entry','moneyForm')
+'<div class="seg" style="margin-bottom:10px"><button class="'+(d.type==='spending'?'on':'')+'" data-act="moneyType" data-type="spending">Spending</button><button class="'+(d.type==='income'?'on':'')+'" data-act="moneyType" data-type="income">Income</button></div>'
+'<div class="row mb10">'+inp('drafts.money.amount',d.amount,'type="number" inputmode="decimal" placeholder="Amount ('+esc(sym())+')"')+sel('drafts.money.category',cats,d.category)+'</div>'
+'<div class="mb10">'+inp('drafts.money.note',d.note,'placeholder="Note (optional)"')+'</div><div class="mb14">'+inp('drafts.money.date',d.date,'type="date"')+'</div>'
+'<button class="btn '+(parseFloat(d.amount)>0?'':'off')+'" data-act="moneySave">Save entry</button></div>'}
if(!inM.length)h+='<p class="muted" style="font-size:15px">Nothing recorded for '+label+' yet.</p>';
h+=inM.map(function(e){return '<div class="card" style="padding:14px"><div class="between"><div><div style="font-size:16px">'+esc(e.category)+'</div><div class="tiny muted">'+niceDate(e.date)+(e.note?' · '+esc(e.note):'')+'</div></div><div class="serif '+(e.type==='income'?'pos':'neg')+'" style="font-size:20px">'+(e.type==='income'?'+':'-')+money(e.amount)+'</div></div>'+delRow('money',e.id,'Delete this entry?')+'</div>'}).join('');
return h}

/* ---------- SCHEDULE ---------- */

function tPlayers(t){if(t.players&&t.players.length)return t.players;return vals(S.squad.r).filter(function(r){return r.tid===t.id&&r.status==='in'}).map(function(r){return r.name})}
function stats(){var out={};names().forEach(function(n){out[n]={name:n,played:0,wins:0,top3:0,mvp:0,share:0}});
vals(S.squad.t).filter(function(t){return t.status==='played'}).forEach(function(t){var P=tPlayers(t),net=(t.prize||0)-(t.fee||0);
P.forEach(function(n){var s=out[n]||(out[n]={name:n,played:0,wins:0,top3:0,mvp:0,share:0});s.played++;if(t.placement===1)s.wins++;if(t.placement>=1&&t.placement<=3)s.top3++;s.share+=P.length?net/P.length:0});
if(t.mvp){var m=out[t.mvp]||(out[t.mvp]={name:t.mvp,played:0,wins:0,top3:0,mvp:0,share:0});m.mvp++}});
return Object.keys(out).map(function(k){return out[k]}).sort(function(a,b){return b.wins-a.wins||b.top3-a.top3||b.mvp-a.mvp||b.played-a.played||a.name.localeCompare(b.name)})}

function leader(){return(S.squad.meta&&S.squad.meta.leader)||null}
function isLeader(){var L=leader();return!!(L&&S.profile&&L.name===me())}
function sha(s){var txt='kl13:'+s;
if(window.crypto&&crypto.subtle&&window.TextEncoder){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
var h=5381;for(var i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))|0;return Promise.resolve('d'+(h>>>0).toString(16))}

var T=vals(S.squad.t),R=vals(S.squad.r),CM=vals(S.squad.c);
var rem=T.filter(function(t){var n=daysBetween(today(),t.date);return t.status==='upcoming'&&n>=0&&n<=3}).sort(function(a,b){return a.date.localeCompare(b.date)});
var need=T.filter(function(t){return t.status==='upcoming'&&daysBetween(today(),t.date)<0});
var noReply=T.filter(function(t){return t.status==='upcoming'&&daysBetween(today(),t.date)>=0&&!R.some(function(r){return r.tid===t.id&&r.name===me()})});
var unread=CM.filter(function(m){return m.at>(SEEN.chat||0)&&m.name!==me()}).length;
var AN=vals(S.squad.a).sort(function(a,b){return b.at-a.at})[0];
if(S.tab==='chat'){var mx=CM.reduce(function(a,m){return Math.max(a,m.at)},0);if(mx>(SEEN.chat||0)){SEEN.chat=mx;lsSet(LS.seen,SEEN)}unread=0;if(AN&&SEEN.ann!==AN.id){SEEN.ann=AN.id;lsSet(LS.seen,SEEN)}}
var h='<div class="between" style="align-items:center"><div><h1>Squad '+SQUAD_NAME+'</h1><div class="small muted">'+esc(me())+(isLeader()?' · Leader':'')+'</div></div><div style="display:flex;gap:6px;align-items:center"><button class="ghost" data-act="refresh" aria-label="Refresh" style="font-size:20px">⟳</button><select data-f="profile.currency" data-render aria-label="Currency" style="width:auto;padding:6px 8px;font-size:15px">'+['$','€','£','₹','¥','₦','R$'].map(function(c){return '<option'+(c===sym()?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div></div>'
+'<div class="tabs">'+[['goals','Goals'],['money','My money'],['schedule','Schedule'],['split','Split'],['chat','Chat'+(unread?' ('+unread+')':'')],['squad','Squad']].map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
if(AN&&SEEN.ann!==AN.id&&S.tab!=='chat')h+='<div class="banner" style="background:var(--warnbg);border:1px solid var(--sun)"><div style="font-size:12.5px;margin-bottom:4px">📢 Announcement from '+esc(AN.by)+'</div><div style="line-height:1.4">'+esc(AN.text)+'</div><button data-act="annSeen" data-id="'+AN.id+'" style="margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid var(--sun);background:transparent;font-size:13px">Got it</button></div>';
if(rem.length)h+='<div class="banner" style="background:var(--warnbg);border:1px solid var(--sun)">'+rem.map(function(t){var c=R.filter(function(r){return r.tid===t.id&&r.status==='in'}).length;return '<div style="padding:3px 0">🔔 <strong>'+esc(t.name)+'</strong> '+countdown(t.date).toLowerCase()+(t.time?' at '+esc(t.time):'')+' · '+c+' in</div>'}).join('')+'</div>';
if(noReply.length&&S.tab!=='schedule')h+='<button class="banner" data-act="tab" data-v="schedule" style="background:var(--surface);border:1px solid var(--line)">You haven\'t replied to '+noReply.length+' tournament'+(noReply.length>1?'s':'')+'. Tap to say if you\'re in.</button>';
if(need.length&&S.tab!=='schedule')h+='<button class="banner" data-act="tab" data-v="schedule" style="background:var(--infobg);border:1px solid var(--teal)">'+need.length+' tournament'+(need.length>1?'s':'')+' finished. Tap to record the result.</button>';
if(!leader()&&S.tab!=='squad')h+='<button class="banner" data-act="tab" data-v="squad" style="background:var(--surface);border:1px solid var(--line)">Your squad has no leader yet. Tap to become the leader.</button>';
if(S.sync==='offline'&&DB)h+='<div class="banner" style="background:var(--errbg);color:var(--red)">Can\'t reach the squad database. Showing the last data this phone saw.</div>';
if(S.error)h+='<div class="banner" style="background:var(--errbg);color:var(--red)">'+esc(S.error)+'</div>';
h+=S.tab==='goals'?goalsView():S.tab==='money'?myMoneyView():S.tab==='schedule'?scheduleView():S.tab==='split'?splitView():S.tab==='chat'?chatView():squadView();
app.innerHTML=h;
if(S.tab==='chat'&&S.ui.focusChat){var ci=document.getElementById('chatInput');if(ci)ci.focus();S.ui.focusChat=false}
if(S.tab==='chat'&&S.ui.scrollChat){window.scrollTo(0,document.body.scrollHeight);S.ui.scrollChat=false}}

/* ---------- events ---------- */
function setPath(path,val){var p=path.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function saveProfile(){lsSet(LS.profile,S.profile)}
function typing(){var a=document.activeElement;return a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&document.getElementById('app').contains(a)}
function renderMsgs(){var m=document.getElementById('msgs');if(m)m.innerHTML=msgsHtml()}
function sendChat(){var txt=S.drafts.chat.text.trim();if(!txt)return;var id=uid();
put('c',id,{id:id,name:me(),text:txt.slice(0,500),at:Date.now()});
var C=vals(S.squad.c).sort(function(a,b){return a.at-b.at});while(C.length>200){del('c',C.shift().id)}
S.drafts.chat.text='';S.ui.focusChat=true;S.ui.scrollChat=true;render()}
function postAnn(){var txt=S.drafts.ann.text.trim();if(!txt||!isLeader())return;var id=uid();put('a',id,{id:id,text:txt.slice(0,300),by:me(),at:Date.now()});S.drafts.ann.text='';render()}

document.addEventListener('input',function(e){var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');if(!f||t.type==='checkbox')return;setPath(f,t.value);
var btn=document.querySelector('[data-act=goalSave],[data-act=moneySave],[data-act=tSave],[data-act=sSave],[data-act=join]');
if(btn){var d=S.drafts,ok=true,a=btn.getAttribute('data-act');
if(a==='goalSave')ok=d.goal.title.trim().length>0;else if(a==='moneySave')ok=parseFloat(d.money.amount)>0;else if(a==='tSave')ok=d.sched.name.trim().length>0;else if(a==='join')ok=d.join.name.trim().length>=2;else if(a==='sSave')ok=parseFloat(d.split.amount)>0&&d.split.desc.trim().length>0&&d.split.split.length>0;
btn.classList.toggle('off',!ok)}});
document.addEventListener('change',function(e){var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');if(!f)return;setPath(f,t.value);if(f==='profile.currency')saveProfile();if(t.hasAttribute('data-render'))render()});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var id=e.target.id;if(id==='chatInput'){e.preventDefault();sendChat()}else if(id==='annInput'){e.preventDefault();postAnn()}});

document.addEventListener('click',function(e){
var el=e.target.closest('[data-act]');if(!el)return;
var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),D=S.drafts,N;
S.error='';
switch(a){
case 'join':{var nm=D.join.name.trim();if(nm.length<2)return;S.kickedMsg='';S.profile={name:nm,currency:'$'};saveProfile();
pull().then(function(){if(!S.profile)return;return put('members',san(nm),{name:nm,joined:today()})}).then(render);S.tab='schedule';break}
case 'refresh':pull().then(function(){return pullChat()}).then(render);return;
case 'tab':S.tab=el.getAttribute('data-v');S.ui.confirm=null;S.ui.act=null;S.ui.pin='';S.ui.pinMsg='';if(S.tab==='chat'){S.ui.scrollChat=true;pullChat().then(function(){if(S.tab==='chat'&&!typing()){render()}})}break;
case 'goalForm':S.ui.goalForm=!S.ui.goalForm;break;
case 'goalSave':{var g=D.goal;if(!g.title.trim())return;var tg=parseFloat(g.target)>0?parseFloat(g.target):100;S.goals.unshift({id:'g'+Date.now(),title:g.title.trim(),target:tg,unit:g.target?g.unit.trim():'%',deadline:g.deadline||'',createdAt:today(),current:0,done:false,log:[]});D.goal={title:'',target:'',unit:'',deadline:''};S.ui.goalForm=false;savePersonal();break}
case 'goalLog':{var amt=parseFloat(S.ui.log[id]);if(!amt)return;S.goals.forEach(function(x){if(x.id===id){x.current=Math.max(0,x.current+amt);if(x.current>=x.target)x.done=true;x.log.unshift({amt:amt,date:today()});x.log=x.log.slice(0,50)}});S.ui.log[id]='';savePersonal();break}
case 'goalDone':S.goals.forEach(function(x){if(x.id===id)x.done=!x.done});savePersonal();break;
case 'monthPrev':case 'monthNext':{var p=S.ui.month.split('-').map(Number),dd=new Date(p[0],p[1]-1+(a==='monthNext'?1:-1),1);S.ui.month=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');break}
case 'moneyForm':S.ui.moneyForm=!S.ui.moneyForm;break;
case 'moneyType':D.money.type=el.getAttribute('data-type');D.money.category=D.money.type==='income'?CATS_IN[0]:CATS_OUT[0];break;
case 'moneySave':{var m=D.money,am=parseFloat(m.amount);if(!(am>0))return;S.entries.unshift({id:'m'+Date.now(),type:m.type,amount:am,category:m.category,note:m.note.trim(),date:m.date});D.money.amount='';D.money.note='';S.ui.moneyForm=false;savePersonal();break}
case 'tView':S.ui.tView=el.getAttribute('data-v');break;
case 'tForm':S.ui.tForm=!S.ui.tForm;break;
case 'tSave':{var s=D.sched;if(!s.name.trim()||!s.date)return;N=names();var tid=uid(),fee=parseFloat(s.fee)||0;
put('t',tid,{id:tid,name:s.name.trim(),game:s.game.trim(),date:s.date,time:s.time,fee:fee,notes:s.notes.trim(),status:'upcoming',placement:null,prize:0,createdBy:me()});
if(fee>0&&s.paidBy){var eid=uid();put('e',eid,{id:eid,type:'expense',desc:'Entry fee: '+s.name.trim(),category:'Entry fee',amount:fee,who:s.paidBy,split:N,date:s.date,tid:tid})}
D.sched={name:'',game:'',date:today(),time:'',fee:'',paidBy:'',notes:''};S.ui.tForm=false;S.ui.tView='upcoming';break}
case 'rsvp':{var rid=id+'_'+san(me());put('r',rid,{tid:id,name:me(),status:el.getAttribute('data-s')});break}
case 'rec':{N=names();var ins=vals(S.squad.r).filter(function(r){return r.tid===id&&r.status==='in'&&N.indexOf(r.name)>=0}).map(function(r){return r.name});
S.ui.recording=id;D.result={placement:'',prize:'',receivedBy:'',notes:'',played:ins.length?ins:N.slice(),mvp:''};break}
case 'resTog':{N=names();var pn=N[parseInt(el.getAttribute('data-i'),10)],px=D.result.played.indexOf(pn);if(px>=0)D.result.played.splice(px,1);else D.result.played.push(pn);break}
case 'recCancel':S.ui.recording=null;break;
case 'recSave':{var r=D.result,t0=S.squad.t[id];if(!t0)return;var prize=parseFloat(r.prize)||0;N=names();var players=r.played.length?r.played.slice():N.slice();
var t1=Object.assign({},t0,{status:'played',placement:parseInt(r.placement,10)||null,prize:prize,notes:(r.notes||'').trim()||t0.notes,players:players,mvp:r.mvp||''});put('t',id,t1);
vals(S.squad.e).filter(function(x){return x.tid===id&&x.type==='expense'}).forEach(function(x){put('e',x.id,Object.assign({},x,{split:players}))});
if(prize>0&&r.receivedBy){var pid=uid();put('e',pid,{id:pid,type:'prize',desc:'Prize: '+t0.name,category:'Prize',amount:prize,who:r.receivedBy,split:players,date:t0.date,tid:id})}
S.ui.recording=null;S.ui.tView='history';break}
case 'sForm':N=names();S.ui.sForm=!S.ui.sForm;D.split.who=me();D.split.split=N.slice();break;
case 'sType':D.split.type=el.getAttribute('data-type');break;
case 'splitTog':{N=names();var nm2=N[parseInt(el.getAttribute('data-i'),10)],ix=D.split.split.indexOf(nm2);if(ix>=0)D.split.split.splice(ix,1);else D.split.split.push(nm2);break}
case 'sSave':{var q=D.split,qa=parseFloat(q.amount);if(!(qa>0)||!q.desc.trim()||!q.split.length)return;var xid=uid();
put('e',xid,{id:xid,type:q.type,desc:q.desc.trim(),category:q.type==='prize'?'Prize':q.category,amount:qa,who:q.who||me(),split:q.split.slice(),date:q.date});
D.split.desc='';D.split.amount='';S.ui.sForm=false;break}
case 'settle':{var sid=uid();put('e',sid,{id:sid,type:'payment',desc:'Settled up',category:'Payment',amount:parseFloat(el.getAttribute('data-amt')),who:el.getAttribute('data-from'),to:el.getAttribute('data-to'),split:[],date:today()});break}
case 'chatSend':sendChat();return;
case 'msgDel':del('c',id);break;
case 'annPost':postAnn();return;
case 'annDel':del('a',id);break;
case 'annSeen':SEEN.ann=id;lsSet(LS.seen,SEEN);break;
case 'claimLeader':{var pin=(S.ui.pin||'').trim();if(pin.length<4){S.ui.pinMsg='Use at least 4 digits.';break}
pull().then(function(){if(leader()){S.error='Someone already became the leader.';S.ui.pin='';return}return sha(pin).then(function(hh){S.ui.pin='';S.ui.pinMsg='';return put('meta','leader',{name:me(),pinHash:hh,at:Date.now()})})}).then(render);return}
case 'setPin':{var pin2=(S.ui.pin||'').trim();if(pin2.length<4){S.ui.pinMsg='Use at least 4 digits.';break}
sha(pin2).then(function(hh){S.ui.pin='';S.ui.pinMsg='';var L=leader();return put('meta','leader',{name:L.name,pinHash:hh,at:Date.now()})}).then(render);return}
case 'actAsk':S.ui.act={type:el.getAttribute('data-type'),name:el.getAttribute('data-n')};S.ui.pin='';S.ui.pinMsg='';break;
case 'actCancel':S.ui.act=null;S.ui.pin='';S.ui.pinMsg='';break;
case 'actConfirm':{var act=S.ui.act,L0=leader();if(!act||!L0)return;
sha((S.ui.pin||'').trim()).then(function(hh){
if(hh!==L0.pinHash){S.ui.pinMsg='Wrong PIN. Try again.';render();return}
var key=san(act.name);
if(act.type==='kick'){del('members',key);put('kicked',key,{name:act.name,by:me(),at:Date.now()})}
else if(act.type==='transfer'){put('meta','leader',{name:act.name,pinHash:null,at:Date.now()})}
else if(act.type==='allow'){del('kicked',key)}
S.ui.act=null;S.ui.pin='';S.ui.pinMsg='';render()});return}
case 'delAsk':S.ui.confirm=el.getAttribute('data-kind')+id;break;
case 'delNo':S.ui.confirm=null;break;
case 'delYes':{var k=el.getAttribute('data-kind');if(k==='goal'){S.goals=S.goals.filter(function(x){return x.id!==id});savePersonal()}else if(k==='money'){S.entries=S.entries.filter(function(x){return x.id!==id});savePersonal()}else del(k,id);S.ui.confirm=null;break}
case 'leaveAsk':S.ui.leave=true;break;
case 'leaveNo':S.ui.leave=false;break;
case 'leaveYes':try{localStorage.removeItem(LS.profile)}catch(x){};S.profile=null;S.ui.leave=false;break;
}
render()});

function init(){
S.profile=lsGet(LS.profile,null);S.goals=lsGet(LS.goals,[]);S.entries=lsGet(LS.money,[]);
var sn=lsGet(LS.seen,null);if(sn){SEEN.chat=sn.chat||0;SEEN.ann=sn.ann||''}
render();
pull().then(function(){
if(S.profile&&me()&&!S.squad.members[san(me())])return put('members',san(me()),{name:me(),joined:today()})}).then(render);
if(DB){
setInterval(function(){if(S.profile)pull().then(function(){if(!typing())render();else if(S.tab==='chat')renderMsgs()})},15000);
setInterval(function(){if(S.profile&&S.tab==='chat')pullChat().then(function(){if(S.tab!=='chat')return;if(!typing())render();else renderMsgs()})},5000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.profile)pull().then(function(){if(!typing())render()})})}}
init();
})();
</script>
</body>
</html>
